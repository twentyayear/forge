[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

[[redirects]]
  from = "/api/food"
  to = "/.netlify/functions/food"
  status = 200

# SPA fallback — everything renders from index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
